<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    

     <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .form-floating label {
            padding-left: 35px;
        }
        .form-floating .form-control {
            padding-left: 35px;
        }
        .form-floating i {
            position: absolute;
            top: 16px;
            left: 12px;
            color: #6c757d;
            z-index: 5;
        }
        .btn-login {
            background-color: #0d6efd;
            border: none;
            padding: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg  navbar-light" style="background-color:#279611;">
        <div class="container-fluid">
          <a href="index.html">
            <img src="../static/images/logosinfondo.png"  alt="" style="height: 30px;">
          </a>
          
          <a class="navbar-brand" href="index.html">
            <img src="../static/images/icono app.png" height="30px" alt="">Mi Mercado
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          
          </div>
        </div>
  </nav>
    <div class="container">
        <div class="login-container">
            <div class="logo">
                <i class="fas fa-lock fa-3x text-primary mb-3"></i>
                <h3>Iniciar Sesión</h3>
                <p class="text-muted">Ingresa tus credenciales para acceder</p>
            </div>
            
            <form id="loginForm">
                <!-- Campo Email -->
                <div class="form-floating mb-3">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                    <label for="email">Correo Electrónico</label>
                    <div class="invalid-feedback">
                        Por favor ingresa un correo válido
                    </div>
                </div>
                
                <!-- Campo Contraseña -->
                <div class="form-floating mb-3">
                    <i class="fas fa-key"></i>
                    <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
                    <label for="password">Contraseña</label>
                    <div class="invalid-feedback">
                        La contraseña es requerida
                    </div>
                </div>
                
                <!-- Recordar contraseña -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Recordar mis datos</label>
                </div>
                
                <!-- Botón de envío -->
                <button type="submit" class="btn btn-primary w-100 btn-login mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i> Ingresar
                </button>
                
                <!-- Enlaces adicionales -->
                <div class="text-center">
                    <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
                    
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS y dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Validación del formulario -->
    <script>
        (function() {
            'use strict';
            
            // Fetch the form we want to apply custom Bootstrap validation styles to
            var form = document.getElementById('loginForm');
            
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                
                form.classList.add('was-validated');
            }, false);
        })();
    </script>
</body>
</html>
