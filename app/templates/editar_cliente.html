<body>

  <h1 class="text-">Editar Cliente</h1>
  <form method="POST" ,>
    <div class="form-group">
      <label for="codigo">Nombre:</label>
      <input type="text" class="form-control" id="codigo" name="codigo" value="{{ cliente.nombre }}" required>
    </div>

    <div class="form-group">
      <label for="descripcion">Fecha de nacimiento:</label>
      <input type="text" class="form-control" id="descripcion" name="descripcion" value="{{ cliente.fecha_nacimiento}}"
        required>
    </div>

    <div class="form-group">
      <label for="valor_unitario">Cédula:</label>
      <input type="number" step="0.01" class="form-control" id="valor_unitario" name="valor_unitario"
        value="{{ cliente.cedula }}" required>
    </div>

    <div class="form-group">
      <label for="cantidad_inventario">Telefono:</label>
      <input type="number" class="form-control" id="cantidad_inventario" name="cantidad_inventario"
        value="{{ cliente.telefono}}" required>
    </div>

    <div class="form-group">
      <label for="unidad_medida">Email:</label>
      <input type="text" class="form-control" id="unidad_medida" name="unidad_medida" value="{{ cliente.email }}"
        required>
    </div>

    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
    <a href="{{ url_for('clientes') }}" class="btn btn-secondary">Cancelar</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
